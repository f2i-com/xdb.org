[package]
name = "xdb-wasm"
version = "0.1.2"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Hardened WebAssembly embedding of XDB for browsers, Node/Bun/Deno, and ZIPP."

[workspace]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xdb-core = { path = "../xdb-core" }
xdb-parser = { path = "../xdb-parser" }
xdb-sql = { path = "../xdb-sql" }
xdb-sqlite = { path = "../xdb-sqlite" }
wasm-bindgen = "=0.2.126"
